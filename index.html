<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio & Link Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-row {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-row:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8 flex flex-col items-center">

    <!-- Header / Profile Section -->
    <header class="w-full max-w-4xl text-center mb-10">
        <div class="relative inline-block mb-4">
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full gradient-bg p-1 mx-auto shadow-lg shadow-indigo-500/30">
                <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-3xl sm:text-4xl text-indigo-400 font-bold">
                    <i class="fa-solid fa-code"></i>
                </div>
            </div>
            <span class="absolute bottom-1 right-1 bg-emerald-500 text-xs px-2 py-0.5 rounded-full font-medium text-slate-950 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-slate-950 animate-ping"></span> Live
            </span>
        </div>
        
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">
            Web Developer Portfolio <span class="gradient-text">& Links Hub</span>
        </h1>
        <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto">
            Hello! Here is a list of all my apps, games, and creations in one place.
        </p>

        <!-- Dynamic Category Filters -->
        <div class="flex flex-wrap justify-center gap-2 mt-6" id="categoryFilters">
            <button onclick="filterProjects('all')" class="filter-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium transition">All Projects</button>
            <button onclick="filterProjects('Games')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition">Games</button>
            <button onclick="filterProjects('Web Apps')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition">Web Apps</button>
            <button onclick="filterProjects('E-Commerce')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition">E-Commerce</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl">
        <!-- Loading Spinner -->
        <div id="loader" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-500 mb-3"></i>
            <p class="text-slate-400 text-sm">Loading projects from Firebase...</p>
        </div>

        <!-- Single Line List Container -->
        <div id="projectsList" class="flex flex-col gap-4 hidden">
            <!-- Dynamic Rows Will Appear Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 glass-row rounded-2xl">
            <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
            <h3 class="text-lg font-semibold text-slate-300">No Data Available</h3>
            <p class="text-slate-500 text-sm mt-1">There are no projects currently available in the database.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 text-center text-xs text-slate-500">
        <p>© Developer Portfolio & Links Hub • Fetching Live from Firebase</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const FIREBASE_DB_URL = "https://sate-5a04f-default-rtdb.asia-southeast1.firebasedatabase.app"; 

        let allProjects = [];

        async function fetchProjects() {
            const loader = document.getElementById('loader');
            const list = document.getElementById('projectsList');
            const emptyState = document.getElementById('emptyState');

            try {
                let response = await fetch(`${FIREBASE_DB_URL}/.json`);
                let data = await response.json();

                if (data && data.projects) {
                    data = data.projects;
                }

                loader.classList.add('hidden');
                allProjects = [];

                if (data && typeof data === 'object') {
                    Object.keys(data).forEach(id => {
                        if (data[id] && typeof data[id] === 'object') {
                            allProjects.push({ id, ...data[id] });
                        }
                    });
                    renderProjects(allProjects);
                } else {
                    list.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Firebase fetch error:", error);
                loader.innerHTML = `<p class="text-rose-400 text-sm"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Error loading data!</p>`;
            }
        }

        function renderProjects(projects) {
            const list = document.getElementById('projectsList');
            const emptyState = document.getElementById('emptyState');

            if (projects.length === 0) {
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            list.classList.remove('hidden');
            list.innerHTML = '';

            projects.forEach(project => {
                const techBadges = project.tech ? project.tech.split(',').map(t => `<span class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 text-[11px] font-medium px-2 py-0.5 rounded-md">${t.trim()}</span>`).join('') : '';

                const category = project.category || 'Project';
                const title = project.title || 'Untitled Project';
                const summary = project.summary || 'No summary available.';
                const liveUrl = project.liveUrl || '#';
                
                // Fallback icon if no imageUrl/appIcon is provided in database
                const imageUrl = project.imageUrl || project.appIcon || 'https://cdn-icons-png.flaticon.com/512/1086/1086741.png';

                const rowHtml = `
                    <div class="glass-row rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all duration-300">
                        <!-- Left Container: Image + Info -->
                        <div class="flex items-start gap-4 flex-1">
                            <!-- App/Game Icon or Screenshot Thumbnail -->
                            <img src="${imageUrl}" alt="${title}" class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl object-cover border border-slate-700/80 shrink-0 bg-slate-900" onError="this.src='https://cdn-icons-png.flaticon.com/512/1086/1086741.png'">
                            
                            <!-- Text Content -->
                            <div class="space-y-1.5 flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-indigo-400 border border-slate-700">
                                        ${category}
                                    </span>
                                    <h3 class="text-base font-bold text-white">${title}</h3>
                                </div>
                                <p class="text-slate-300 text-sm line-clamp-2 md:line-clamp-1">${summary}</p>
                                
                                ${techBadges ? `<div class="flex flex-wrap gap-1.5 pt-1">${techBadges}</div>` : ''}
                            </div>
                        </div>

                        <!-- Right Container: Actions -->
                        <div class="flex items-center gap-2 w-full md:w-auto shrink-0 justify-end pt-2 md:pt-0 border-t md:border-t-0 border-slate-800">
                            <a href="${liveUrl}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center justify-center gap-1.5 w-full md:w-auto">
                                <span>Visit / Play</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                            ${project.githubUrl ? `
                                <a href="${project.githubUrl}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-2.5 rounded-lg transition flex items-center gap-1.5">
                                    <i class="fa-brands fa-github text-sm"></i> Code
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;
                list.innerHTML += rowHtml;
            });
        }

        function filterProjects(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-indigo-600', 'text-white');

            if (category === 'all') {
                renderProjects(allProjects);
            } else {
                const filtered = allProjects.filter(p => p.category === category);
                renderProjects(filtered);
            }
        }

        fetchProjects();
    </script>
</body>
</html>
